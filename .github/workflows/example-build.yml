name: Build Example App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The `signed-release` job archives an IPA for device-side FreeRASP checks;
# it does not upload to TestFlight.

permissions:
  contents: read

concurrency:
  group: example-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Example/Example.xcodeproj
  SCHEME: Example
  # Generic Simulator destination — independent of which concrete iPhone
  # runtime ships on the runner image.
  IOS_SIMULATOR: generic/platform=iOS Simulator

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # Cache the SPM package store only — NOT .derivedData. Restoring
      # .derivedData from a previous run carries over already-linked
      # binaries from older package versions, and Xcode happily reuses
      # them instead of re-resolving against the new pbxproj/Package.swift.
      # No `restore-keys` so a partial match can't pull in a stale
      # resolution either — better to re-download the xcframework than
      # silently build against the wrong version.
      - name: Restore SPM cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/*.xcodeproj/project.pbxproj', 'Package.swift', '**/Package.resolved') }}

      - name: Build Example for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "${IOS_SIMULATOR}" \
            -derivedDataPath .derivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  signed-release:
    name: Signed Release IPA
    # Match the internal SDK workflow: archive a signed release whenever CI
    # has its signing secrets, and otherwise leave the normal CI build green.
    runs-on: macos-15
    timeout-minutes: 30
    # The provisioning profile is managed as an environment secret, matching
    # the internal demo-release workflow.
    environment: testing

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Restore SPM cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/*.xcodeproj/project.pbxproj', 'Package.swift', '**/Package.resolved') }}

      # Signing-secret names shared with the internal sdk-ios workflow:
      # - IOS_DISTRIBUTION_CERT_BASE64: base64-encoded .p12 distribution certificate
      # - IOS_DISTRIBUTION_CERT_PASSWORD: password for that .p12
      # - IOS_PROVISIONING_PROFILE_BASE64: base64-encoded ad-hoc provisioning profile
      # - KEYCHAIN_PASSWORD: temporary CI keychain password
      # All four live on the `testing` GitHub Environment.
      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          # Three states, deliberately distinguished. Nothing configured is the
          # normal case on forks and before secrets are provisioned, so it skips
          # and leaves CI green. *Partially* configured is always a mistake —
          # typically a secret stored under the wrong name — and must not be
          # allowed to masquerade as the skip case, because that reports success
          # while producing no IPA at all.
          present=(); missing=()
          for name in IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD \
                      IOS_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -n "${!name}" ]; then present+=("$name"); else missing+=("$name"); fi
          done

          if [ "${#present[@]}" -eq 0 ]; then
            echo "::warning::No iOS signing secrets configured; skipping the signed release archive."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::iOS signing is partially configured. Missing: ${missing[*]}"
            echo "::error::Check for a typo in the secret names — the workflow reads IOS_DISTRIBUTION_CERT_* (not IOS_DISTRIBUTION_CERTIFICATE_*)."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Signing material: remove the decoded p12 as soon as it is imported.
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT

          echo -n "$IOS_DISTRIBUTION_CERT_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$(security cms -D -i "$PROFILE_PATH")"
          PROFILE_UUID="$(printf '%s' "$PROFILE_PLIST" | plutil -extract UUID raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Derive team and profile name from the profile itself so there is no
          # second copy of them to drift out of sync.
          PROFILE_NAME="$(printf '%s' "$PROFILE_PLIST" | plutil -extract Name raw -)"
          TEAM_ID="$(printf '%s' "$PROFILE_PLIST" | plutil -extract TeamIdentifier.0 raw -)"
          # The export method has to match the profile type or -exportArchive
          # fails on a mismatch: profiles that provision specific devices are
          # ad-hoc/development, ones that don't are App Store.
          if printf '%s' "$PROFILE_PLIST" | plutil -extract ProvisionedDevices raw - >/dev/null 2>&1; then
            EXPORT_METHOD="release-testing"   # formerly `ad-hoc`
          else
            EXPORT_METHOD="app-store-connect"
          fi

          {
            echo "TEAM_ID=$TEAM_ID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "EXPORT_METHOD=$EXPORT_METHOD"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Archive signed Release app
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -o pipefail
          # Manual signing, matching vrtx-sdk-ios's release-demo.yml. Automatic
          # signing needs Xcode to authenticate to Apple, which CI cannot do
          # with only a cert and profile in the keychain.
          #
          # An xcconfig applies these settings build-wide. vrtx-sdk-ios cannot do
          # that (VRTX-2717: a build-wide PROVISIONING_PROFILE_SPECIFIER reaches
          # its first-party VRTX.framework target and -exportArchive then fails
          # with "VRTX.framework does not support provisioning profiles"), which
          # is why it bakes signing into per-tenant build configurations instead.
          # Here VRTX arrives as an SPM binaryTarget rather than a project
          # target, so there is no framework target to receive a profile and the
          # simpler xcconfig is sufficient. If export ever fails on an embedded
          # framework, move these onto the Example target in project.pbxproj.
          cat > "$RUNNER_TEMP/signing.xcconfig" <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF
          xcodebuild archive \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Example.xcarchive" \
            -derivedDataPath .derivedData \
            -skipPackagePluginValidation \
            -xcconfig "$RUNNER_TEMP/signing.xcconfig" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db"

      - name: Export IPA
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.vrtx.Example</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Example.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload signed IPA artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Example-signed-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
